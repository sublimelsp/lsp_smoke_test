name: LSP smoke test
description: >-
  Install LSP packages in Sublime Text, open sample files and check that their language servers report the expected
  diagnostics.

inputs:
  install-package:
    description: >-
      Whether to install the package checked out at package-path. Set to false when there is no package under test,
      for example when testing a library with packages from extra-packages.
    default: 'true'
  package-path:
    description: Where the package under test is checked out. It must be a git checkout.
    default: '.'
  package-name:
    description: Name of the package under test. Derived from the repository name if empty.
    default: ''
  fixture-dir:
    description: >-
      Directories containing smoke.yaml and the files it refers to, one per line. Each one is a separate test, all run
      in the same Sublime Text session. Relative to package-path, or absolute paths.
    default: tests/smoke
  extra-packages:
    description: >-
      Other packages to install, one per line, in the form user/repo@ref or package:user/repo@ref. Without @ref, the
      latest tag is used.
    default: ''
  local-libraries:
    description: >-
      Libraries to replace with a local copy after Package Control has installed them, one per line, in the form
      name=path. The path is the library's directory, for example lsp_utils=lsp_utils/lsp_utils.
    default: ''
  lsp-ref:
    description: Branch, tag or commit of sublimelsp/LSP to test against. The latest release if empty.
    default: ''
  github-token:
    description: Token used to look up the latest LSP release.
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    # The logic lives in scripts/, the steps only run it. Python is started from bash because on Windows, Git Bash
    # converts SUBLIME_TEXT_PACKAGES, which UnitTesting sets to a path like /c/st/Data/Packages/, to C:/st/...
    - name: Prepare
      id: prepare
      shell: bash
      env:
        INPUT_PACKAGE_NAME: ${{ inputs.package-name }}
        INPUT_INSTALL_PACKAGE: ${{ inputs.install-package }}
        INPUT_PACKAGE_PATH: ${{ inputs.package-path }}
        INPUT_FIXTURE_DIR: ${{ inputs.fixture-dir }}
        INPUT_LSP_REF: ${{ inputs.lsp-ref }}
        INPUT_GITHUB_TOKEN: ${{ inputs.github-token }}
      run: python "$GITHUB_ACTION_PATH/scripts/prepare.py"

    - name: Set up Sublime Text
      uses: SublimeText/UnitTesting/actions/setup@v1
      with:
        sublime-text-version: 4
        package-name: ${{ steps.prepare.outputs.package }}
        install-package: ${{ inputs.install-package }}
        package-path: ${{ inputs.package-path }}
        extra-packages: |
          sublimelsp/LSP@${{ steps.prepare.outputs.lsp-ref }}
          ${{ inputs.extra-packages }}

    - name: Install smoke test harness
      shell: bash
      env:
        INPUT_LOCAL_LIBRARIES: ${{ inputs.local-libraries }}
      run: python "$GITHUB_ACTION_PATH/scripts/install_harness.py"

    - name: Run smoke test
      uses: SublimeText/UnitTesting/actions/run-tests@v1
      with:
        package-name: LSPSmokeTest
