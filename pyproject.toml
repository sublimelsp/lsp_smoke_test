[project]
name = "lsp-smoke-test"
version = "0"
description = "Smoke test for LSP packages for Sublime Text"
# Only the development tools run on this version. The harness targets Sublime Text's Python 3.8, see pythonVersion below.
requires-python = ">=3.10"

[dependency-groups]
dev = [
  "pyright==1.1.414",
  "pyyaml==6.0.3",
  "ruff==0.17.1",
  "sublime-text-stubs==4200.1",
  "types-pyyaml==6.0.12.20260906",
]

[tool.pyright]
include = ["harness", "scripts"]
# LSP and UnitTesting are not published on PyPI. Clone them into .deps to type-check against them:
#   git clone --depth 1 https://github.com/sublimelsp/LSP.git .deps/LSP
#   git clone --depth 1 https://github.com/SublimeText/UnitTesting.git .deps/UnitTesting
extraPaths = [".deps", ".deps/UnitTesting"]
pythonVersion = "3.8"
reportMissingModuleSource = "none"
typeCheckingMode = "standard"
executionEnvironments = [
  # UnitTesting's deferred test cases use generators for setUp and tearDown.
  { root = "harness/tests", reportIncompatibleMethodOverride = "none" },
]

[tool.ruff]
exclude = [".deps", "examples"]
line-length = 120
target-version = "py38"

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint]
preview = true
select = ["ALL"]
# Refer to https://docs.astral.sh/ruff/rules/
ignore = [
  "any-type",
  "missing-copyright-notice",
  "missing-trailing-comma",
  "undocumented-public-module",
  "undocumented-public-class",
  "undocumented-public-method",
  "undocumented-public-function",
  "undocumented-public-package",
  "docstring-missing-returns",
  "docstring-missing-yields",
  "incorrect-blank-line-before-class",
  "multi-line-summary-first-line",
  "no-self-use",
  "bad-quotes-inline-string",
  "pytest-unittest-assertion",
]

[tool.ruff.lint.per-file-ignores]
# Command line scripts run by the action, not a package.
"scripts/*" = [
  "implicit-namespace-package",
  "print",
  # The scripts only run fixed commands and open a fixed https URL.
  "suspicious-subprocess-import",
  "subprocess-without-shell-equals-true",
  "suspicious-url-open-usage",
]

[tool.ruff.lint.isort]
case-sensitive = false
force-single-line = true
from-first = true
no-sections = true
order-by-type = false
required-imports = ["from __future__ import annotations"]

[tool.uv]
package = false
