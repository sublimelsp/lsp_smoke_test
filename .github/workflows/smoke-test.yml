name: LSP smoke test

on:
  workflow_call:
    inputs:
      lsp-ref:
        description: >-
          Branch, tag or commit of sublimelsp/LSP to test against. If empty, the LSP_SMOKE_TEST_LSP_REF configuration
          variable is used, and the latest release if that isn't set either.
        type: string
        default: ''
      os:
        description: JSON list of runners to test on.
        type: string
        default: '["ubuntu-latest", "macos-latest", "windows-latest"]'
      fixture-dir:
        description: Directory containing smoke.yaml, relative to the repository root.
        type: string
        default: tests/smoke
      package-name:
        description: Name of the package under test. Derived from the repository name if empty.
        type: string
        default: ''
      extra-packages:
        description: >-
          Other packages to install, one per line, in the form user/repo@ref or package:user/repo@ref. Without @ref,
          the latest x.y.z tag is used.
        type: string
        default: ''

jobs:
  smoke:
    name: Smoke test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.os) }}
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out package
        uses: actions/checkout@v7
        with:
          path: package

      # Use the action from the same commit as this workflow, so that callers only pin one version.
      - name: Check out smoke test action
        uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .lsp_smoke_test

      - name: Run smoke test
        uses: ./.lsp_smoke_test
        with:
          package-path: package
          package-name: ${{ inputs.package-name }}
          fixture-dir: ${{ inputs.fixture-dir }}
          lsp-ref: ${{ inputs.lsp-ref }}
          extra-packages: ${{ inputs.extra-packages }}
