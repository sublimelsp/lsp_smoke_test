name: Self-test

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    name: ${{ matrix.package }} (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        package: [LSP-esphome, LSP-json, LSP-oxfmt, LSP-ruff, LSP-rust-analyzer]
        include:
          - package: LSP-esphome
            extra-packages: SublimeText/ESPHome@4143-
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out action
        uses: actions/checkout@v7
        with:
          path: action

      - name: Check out ${{ matrix.package }}
        uses: actions/checkout@v7
        with:
          repository: sublimelsp/${{ matrix.package }}
          path: package

      - name: Run smoke test
        uses: ./action
        with:
          package-path: package
          package-name: ${{ matrix.package }}
          fixture-dir: ${{ github.workspace }}/action/examples/${{ matrix.package }}
          extra-packages: ${{ matrix.extra-packages }}

  # Tests a library instead of a package: the packages come from extra-packages, and lsp_utils is replaced with a
  # checkout of its default branch. Several fixtures run in one Sublime Text session, one of them with settings.
  library:
    name: lsp_utils (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out action
        uses: actions/checkout@v7
        with:
          path: action

      - name: Check out lsp_utils
        uses: actions/checkout@v7
        with:
          repository: sublimelsp/lsp_utils
          path: lsp_utils

      - name: Run smoke test
        uses: ./action
        with:
          install-package: false
          extra-packages: |
            sublimelsp/LSP-pyright
            sublimelsp/LSP-ruff
          local-libraries: lsp_utils=lsp_utils/lsp_utils
          fixture-dir: |
            ${{ github.workspace }}/action/examples/LSP-pyright
            ${{ github.workspace }}/action/examples/LSP-pyright-system-node
            ${{ github.workspace }}/action/examples/LSP-ruff

  # A server that keeps crashing makes LSP show a dialog. The test has to fail with the report, which includes the
  # dialog's message, rather than block on it until UnitTesting stops the run with "Timeout: output is frozen".
  crash:
    name: Crashing server (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out action
        uses: actions/checkout@v7
        with:
          path: action

      - name: Run smoke test
        id: smoke
        continue-on-error: true
        uses: ./action
        with:
          install-package: false
          fixture-dir: ${{ github.workspace }}/action/examples/crashing-server

      - name: Check that the test failed with a report
        shell: bash
        env:
          OUTCOME: ${{ steps.smoke.outcome }}
        run: |
          result="$SUBLIME_TEXT_PACKAGES/User/UnitTesting/LSPSmokeTest/result"
          test "$OUTCOME" = failure
          grep -q 'LSP showed a dialog' "$result"
          grep -q 'Dialogs shown: ' "$result"
          grep -Eq '(message_dialog, answered OK|ok_cancel_dialog, answered Cancel): ' "$result"
